[package]
name = "ft-fixture"
description = "Minimal NEP-141 token used only by the sandbox tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.16"
near-contract-standards = "5.19.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Its own workspace root, so the parent package doesn't try to absorb it and
# fail with "current package believes it's in a workspace when it's not".
[workspace]
